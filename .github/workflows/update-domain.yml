
name: Aggiorna dominio StreamingCommunity

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-domain:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trova il dominio corrente
        run: python3 scripts/update_domain.py

      - name: Pubblica se il dominio è cambiato
        run: |
          if git diff --quiet -- docs/latest.json; then
            echo "Dominio invariato"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/latest.json
          git commit -m "Aggiorna dominio StreamingCommunity"
          git push
